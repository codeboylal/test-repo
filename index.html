<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Sample Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f4f4f4;
        }
        header {
            background: #0078d7;
            color: #fff;
            padding: 20px 0;
            text-align: center;
        }
        main {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            max-width: 700px;
            margin: 30px auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
        }
        footer {
            text-align: center;
            color: #888;
            margin-top: 40px;
        }
        a.button {
            display: inline-block;
            padding: 10px 20px;
            background: #0078d7;
            color: #fff;
            border-radius: 4px;
            text-decoration: none;
            margin-top: 20px;
        }
        a.button:hover {
            background: #005fa3;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to My Sample Website</h1>
    </header>
    <main>
        <h2>About This Site</h2>
        <p>This is a simple sample website created with HTML and CSS. You can use this as a starting point for your own projects.</p>
        <a href="https://github.com/" class="button" target="_blank">Visit GitHub</a>
    </main>
    <footer>
        &copy; 2024 Sample Website
    </footer>
</body>
</html>
